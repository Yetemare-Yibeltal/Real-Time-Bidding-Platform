<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Metadata -->
    <title>BidMaster | Premium Online Auction Platform</title>
    <meta name="description" content="BidMaster - Experience high-performance, real-time online auctions with a modern, glassmorphic design interface." />
    <meta name="theme-color" content="#0ea5a3" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- External Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
      .timer-urgent { animation: pulse 1s infinite; }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.6; background-color: rgba(239, 68, 68, 0.1); border-radius: 0.5rem; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  
  <body class="bg-[#05070a] text-white">
    <!-- Application Roots -->
    <div id="root"></div>
    <div id="ai-assist-root"></div>
    
    <!-- Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
